<!-- @dsCard group="문서 구성요소" height=180 subtitle="범례 줄" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 28px}
.row{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.55;color:var(--muted);min-width:0}
.row b{color:var(--ink);font-weight:500}
.n{flex:none;min-width:32px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:var(--radius-pill);background:var(--amber);color:var(--on-amber);font-weight:700;font-size:12px;line-height:24px;text-align:center}
</style></head><body>
<div class="legend">
  <div class="row"><span class="n">1</span><span><b>카메라 화면</b> 현재 검사 중인 너트의 영상입니다.</span></div>
  <div class="row"><span class="n">2</span><span><b>판정</b> 정상이면 OK, 불량이면 NG로 크게 표시합니다.</span></div>
  <div class="row"><span class="n">C2</span><span><b>상단 메뉴</b> 4개 화면에 공통으로 있습니다.</span></div>
  <div class="row"><span class="n">3</span><span><b>이상 점수</b> 숫자가 클수록 불량에 가깝습니다.</span></div>
</div>
</body></html>
